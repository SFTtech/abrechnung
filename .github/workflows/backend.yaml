name: backend
on:
    workflow_call:

jobs:
    format:
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.12"
            - name: Install uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  enable-cache: true
            - name: Install the project
              run: uv sync --locked --all-extras --dev
            - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
            - name: Check formatting
              run: just check-format

    pylint:
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.12"
            - name: Install uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  enable-cache: true
            - name: Install the project
              run: uv sync --locked --all-extras --dev
            - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
            - name: Analysing the code with pylint
              run: just pylint

    typecheck:
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.12"
            - name: Install uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  enable-cache: true
            - name: Install the project
              run: uv sync --locked --all-extras --dev
            - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
            - name: Run the typechecker on the code
              run: just typecheck

    ruff:
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.12"
            - name: Install uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  enable-cache: true
            - name: Install the project
              run: uv sync --locked --all-extras --dev
            - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
            - name: Analysing the code with ruff
              run: just ruff

    test:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                python-version:
                    - "3.12"
                    - "3.13"
                os: [ubuntu-26.04]
        services:
            postgres:
                image: postgres
                env:
                    POSTGRES_PASSWORD: "password"
                    POSTGRES_USER: "abrechnung"
                    POSTGRES_DB: "abrechnung"
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432
        env:
            TEST_DB_USER: "abrechnung"
            TEST_DB_HOST: "localhost"
            TEST_DB_DATABASE: "abrechnung"
            TEST_DB_PASSWORD: "password"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  enable-cache: true
            - name: Install the project
              run: uv sync --locked --all-extras --dev
            - name: Run all tests
              run: uv run pytest tests --doctest-modules --junitxml=junit/test-results.xml --cov=abrechnung --cov-report=xml --cov-report=html
            - name: Add coverage to the job summary
              if: ${{ !cancelled() && matrix.python-version == '3.13' }}
              run: |
                  echo "## Backend coverage (pytest)" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
            - name: Upload coverage report
              if: ${{ !cancelled() && matrix.python-version == '3.13' }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: backend-coverage
                  path: |
                      htmlcov
                      coverage.xml
                      junit
                  if-no-files-found: ignore
                  retention-days: 7
