repos:
    - repo: local
      hooks:
          - id: vp-fmt
            name: vp fmt
            # uses the fmt settings from the root vite.config.ts
            entry: pnpm exec vp fmt --no-error-on-unmatched-pattern
            language: system
            "types_or": [javascript, jsx, ts, tsx, json, yaml]
            require_serial: false
          - id: vp-lint
            name: vp lint
            # uses the lint settings from the root vite.config.ts
            entry: pnpm exec vp lint
            language: system
            "types_or": [javascript, jsx, ts, tsx]
            verbose: true
          - id: ty
            name: ty check
            entry: uv run ty check .
            pass_filenames: false
            language: python
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-yaml
          - id: end-of-file-fixer
          - id: trailing-whitespace
    - repo: https://github.com/astral-sh/ruff-pre-commit
      # Ruff version.
      rev: v0.14.10
      hooks:
          # Run the linter.
          - id: ruff
            args: [--fix]
          # Run the formatter.
          - id: ruff-format
