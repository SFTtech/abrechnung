packages:
    - "apps/*"
    - "libs/*"
catalog:
    vite: npm:@voidzero-dev/vite-plus-core@1.6.0
    vitest: 5.1.0
    vite-plus: 1.6.0
    "@vitest/coverage-v8": 5.1.0
    "@vitest/ui": 5.1.0
overrides:
    vite@*: "catalog:"
    vitest@*: "catalog:"
peerDependencyRules:
    allowAny:
        - vite
        - vitest
    allowedVersions:
        vite: "*"
        vitest: "*"
allowBuilds:
    "@parcel/watcher": false
    esbuild: false
    less: false
